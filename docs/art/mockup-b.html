<!doctype html>
<!--
  SWING SALVAGE — B · Paper Cut target look (reference only, not shipped).
  390x844 phone frame. Game scales by S = 540/390. Gameplay sizes come from GDD Appendix A, not from this file.
  HUD here is the CURRENT HUD (GDD §11.2): best (left), score + ship progress + streak dots (center), pause (right),
  gust warning tag (right edge), floating "+2 PERFECT" tag. No coins / fuel / timer / drop button.
  Helicopter paths: local coords inside the group transform "translate(205 240) rotate(-10) scale(.85)".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Salvage – Paper Cut reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#8a9794;display:flex;justify-content:center;padding:24px 0}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.b-fl{flood-color:#1D2C2E;flood-opacity:.3}
.b-fl2{flood-color:#1D2C2E;flood-opacity:.22}
.b-rain{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;opacity:.75}
.b-rain2{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-linecap:round;opacity:.5}
.b-wind{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;opacity:.7}
.b-foam{fill:none;stroke:#F4F1E8;stroke-width:3.5;stroke-linecap:round}
.b-splash{fill:none;stroke:#FFFFFF;stroke-width:2.5;stroke-linecap:round}
.b-arc{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round;opacity:.8}
.b-rope{fill:none;stroke:#5A4636;stroke-width:2.6;stroke-linecap:round}
.b-sling{fill:none;stroke:#5A4636;stroke-width:1.8;stroke-linecap:round}
.b-plank{fill:none;stroke:#B98221;stroke-width:2.5;stroke-linecap:round}
.b-motion{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;opacity:.75}
.b-skid{fill:none;stroke:#34474B;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.b-glint{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;opacity:.9}
.b-seam{fill:none;stroke:#000000;stroke-width:1.5;opacity:.15}
.b-mast{fill:none;stroke:#2F4858;stroke-width:3;stroke-linecap:round}
.b-slot{fill:none;stroke:#2F4858;stroke-width:2.2;stroke-linecap:round;opacity:.5}
.card{background:#F7F3EA;border-radius:14px;box-shadow:0 3px 0 rgba(29,44,46,.18),0 6px 14px rgba(29,44,46,.18)}
</style>
</head>
<body>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#BCCBC7;font-family:'Fredoka',sans-serif;color:#24353A;border-radius:28px">

<svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0;display:block" aria-hidden="true">
<defs>
<filter id="b-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" class="b-fl"/></filter>
<filter id="b-cl" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" class="b-fl2"/></filter>
<filter id="b-up" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-3" stdDeviation="3" class="b-fl2"/></filter>
<pattern id="b-rain1" width="48" height="76" patternUnits="userSpaceOnUse"><path class="b-rain" d="M14 4 l-4 11 M36 34 l-4 11 M24 58 l-4 11"/></pattern>
<pattern id="b-rain2" width="89" height="121" patternUnits="userSpaceOnUse"><path class="b-rain2" d="M22 12 l-3 9 M66 68 l-3 9"/></pattern>
</defs>

<!-- sky + clouds + lightning -->
<rect width="390" height="844" fill="#BCCBC7"/>
<path id="cloud-back" fill="#A3B5B1" filter="url(#b-cl)" d="M-20 262 C14 226 62 230 84 250 C112 214 172 218 196 246 C226 222 276 226 296 252 C326 232 372 236 410 262 L410 0 L-20 0 Z"/>
<path id="bolt" fill="#F3C44E" filter="url(#b-sh)" d="M78 150 L58 222 L74 219 L50 300 L94 206 L77 209 L94 150 Z"/>
<path id="cloud-front" fill="#E9ECE4" filter="url(#b-cl)" d="M-20 196 C10 160 58 158 80 178 C102 132 168 130 190 168 C216 140 268 144 284 176 C310 152 368 156 410 190 L410 0 L-20 0 Z"/>

<!-- wind strips (gust) -->
<path class="b-wind" d="M384 318 C344 312 300 322 252 316 M168 392 C130 388 96 396 52 390 M372 548 C340 544 316 550 286 546"/>

<!-- sea back -->
<path fill="#86AFA9" filter="url(#b-up)" d="M-10 606 Q14 596 38 606 T86 606 T134 606 T182 606 T230 606 T278 606 T326 606 T374 606 T422 606 L422 844 L-10 844 Z"/>

<!-- ship (rolling group) -->
<g id="ship" transform="translate(18 566) rotate(-4 120 50)" filter="url(#b-sh)">
<path class="b-mast" d="M36 -10 L36 -48 M26 -38 L46 -38"/>
<circle cx="36" cy="-51" r="3.5" fill="#D8573E"/>
<rect x="2" y="-12" width="66" height="9" rx="3" fill="#D8573E"/>
<rect x="6" y="-4" width="58" height="52" fill="#F2ECDF"/>
<rect x="12" y="5" width="10" height="10" rx="2" fill="#2F4858"/>
<rect x="28" y="5" width="10" height="10" rx="2" fill="#2F4858"/>
<rect x="44" y="5" width="10" height="10" rx="2" fill="#2F4858"/>
<rect x="64" y="40" width="174" height="7" fill="#CDB497"/>
<path fill="#2F4858" d="M-4 46 L236 46 L252 36 L230 110 L18 110 Z"/>
<path fill="#F2ECDF" d="M-2 57 L240 57 L237 65 L1 65 Z"/>
<g transform="translate(78 4)">
<rect width="46" height="36" rx="3" fill="#E8AE3C"/>
<rect x="40" width="6" height="36" fill="#000" opacity=".12"/>
<path class="b-plank" d="M4 12 L38 12 M4 24 L38 24"/>
</g>
<g transform="translate(84 -31) rotate(-3 20 17)">
<rect width="40" height="34" rx="3" fill="#E8AE3C"/>
<rect x="34" width="6" height="34" fill="#000" opacity=".12"/>
<path class="b-plank" d="M4 11 L32 11 M4 23 L32 23"/>
</g>
<!-- empty slot corner marks -->
<path class="b-slot" d="M146 28 L146 38 L156 38 M206 38 L216 38 L216 28 M146 14 L146 6 L154 6 M208 6 L216 6 L216 14"/>
</g>

<!-- sea mid -->
<path fill="#659592" filter="url(#b-up)" d="M-10 652 Q20 638 50 652 T110 652 T170 652 T230 652 T290 652 T350 652 T410 652 L410 844 L-10 844 Z"/>
<path class="b-foam" d="M-10 652 Q20 638 50 652 T110 652 T170 652 T230 652 T290 652 T350 652 T410 652"/>

<!-- floating cargo -->
<g transform="translate(330 676) rotate(-16)" filter="url(#b-sh)">
<rect x="-26" y="-22" width="52" height="44" rx="3" fill="#E8AE3C"/>
<rect x="20" y="-22" width="6" height="44" fill="#000" opacity=".12"/>
<path class="b-plank" d="M-22 -7 L18 -7 M-22 7 L18 7"/>
</g>

<!-- sea front + splash -->
<path fill="#477779" filter="url(#b-up)" d="M-20 686 Q16 670 52 686 T124 686 T196 686 T268 686 T340 686 T412 686 L412 844 L-20 844 Z"/>
<path class="b-foam" d="M-20 686 Q16 670 52 686 T124 686 T196 686 T268 686 T340 686 T412 686"/>
<path class="b-splash" d="M298 680 l-7 -9 M306 674 l-2 -11 M354 672 l4 -10 M362 680 l8 -6"/>

<!-- sea deep -->
<path fill="#2E5A5F" filter="url(#b-up)" d="M-30 766 Q10 750 50 766 T130 766 T210 766 T290 766 T370 766 T450 766 L450 844 L-30 844 Z"/>
<path class="b-foam" opacity=".6" d="M-30 766 Q10 750 50 766 T130 766 T210 766 T290 766 T370 766 T450 766"/>

<!-- swing trail + rope -->
<path class="b-arc" d="M161 489 A229 229 0 0 0 306 472"/>
<path class="b-rope" d="M209 265 Q236 350 284 422"/>

<!-- carried cargo -->
<g id="cargo" transform="translate(268 486) rotate(14)" filter="url(#b-sh)">
<path class="b-sling" d="M0 -56 L-28 -26 M0 -56 L28 -26"/>
<rect x="-6" y="-66" width="12" height="10" rx="2.5" fill="#34474B"/>
<rect x="-32" y="-26" width="64" height="52" rx="4" fill="#E8AE3C"/>
<rect x="25" y="-26" width="7" height="52" fill="#000" opacity=".12"/>
<path class="b-plank" d="M-28 -9 L23 -9 M-28 9 L23 9 M-26 22 L21 -22"/>
</g>

<!-- helicopter (local coords; nose faces left) -->
<g id="heli" transform="translate(205 240) rotate(-10) scale(.85)" filter="url(#b-sh)">
<path class="b-motion" d="M-82 -56 Q0 -66 84 -56"/>
<rect id="heli-rotor" x="-94" y="-49" width="192" height="6" rx="3" fill="#34474B"/>
<rect id="heli-mast" x="-4" y="-44" width="8" height="12" fill="#34474B"/>
<rect id="heli-hub" x="-11" y="-51" width="22" height="7" rx="3" fill="#34474B"/>
<circle id="heli-tailrotor-disc" cx="126" cy="-16" r="14" fill="#FFFFFF" opacity=".35"/>
<rect id="heli-tailrotor-blade" x="123.5" y="-31" width="5" height="30" rx="2.5" fill="#34474B"/>
<path id="heli-fin" fill="#D8573E" d="M110 -6 L122 -32 L132 -32 L126 -2 Z"/>
<path id="heli-body" fill="#D8573E" d="M-58 4 C-58 -16 -44 -30 -20 -32 L30 -32 C44 -32 52 -24 54 -12 L58 -2 L120 -8 L124 -2 L58 14 C50 22 40 26 28 26 L-36 26 C-50 26 -58 18 -58 4 Z"/>
<path id="heli-shade-belly" fill="#000" opacity=".16" d="M-56 12 C-52 22 -45 26 -36 26 L28 26 C40 26 50 22 57 14 Z"/>
<path id="heli-shade-boom" fill="#000" opacity=".16" d="M58 6 L122 -4 L124 -2 L58 14 Z"/>
<path id="heli-window" fill="#D6EBE8" d="M-54 0 C-52 -16 -40 -26 -20 -27 L-12 -27 L-12 2 Z"/>
<path class="b-glint" d="M-44 -12 C-40 -19 -33 -22 -26 -23"/>
<rect id="heli-sidewindow" x="0" y="-24" width="22" height="15" rx="4" fill="#D6EBE8"/>
<path class="b-seam" d="M-6 -30 L-6 24"/>
<path id="heli-skids" class="b-skid" d="M-26 26 L-30 38 M22 26 L26 38 M-44 38 L40 38 M-44 38 Q-52 38 -54 32"/>
<rect id="heli-winch" x="-4" y="26" width="8" height="5" fill="#34474B"/>
<circle cx="124" cy="-3" r="3" fill="#F3C44E"/>
</g>

<!-- rain -->
<rect width="390" height="844" fill="url(#b-rain1)"/>
<rect width="390" height="844" fill="url(#b-rain2)"/>
</svg>

<!-- HUD: best (left) -->
<div class="card" style="position:absolute;left:16px;top:20px;height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;box-sizing:border-box">
<span style="font-size:12px;font-weight:600;letter-spacing:.08em;color:#5B6E70">BEST</span>
<span style="font-size:17px;font-weight:700">24</span>
</div>

<!-- HUD: score (center) -->
<div style="position:absolute;left:0;right:0;top:14px;display:flex;flex-direction:column;align-items:center;gap:5px">
<div class="card" style="min-width:66px;height:48px;padding:0 14px;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
<span style="font-size:30px;font-weight:700;line-height:1">17</span>
</div>
<span style="font-size:11px;font-weight:600;letter-spacing:.06em">SHIP 3 · 2/7</span>
<div style="display:flex;gap:4px">
<span style="width:8px;height:8px;border-radius:4px;background:#BF4630"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#BF4630"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#BF4630"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#F7F3EA;box-shadow:inset 0 0 0 1.5px #5B6E70"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#F7F3EA;box-shadow:inset 0 0 0 1.5px #5B6E70"></span>
</div>
</div>

<!-- HUD: pause (right) -->
<button aria-label="Pause" class="card" style="position:absolute;right:16px;top:16px;width:44px;height:44px;border:none;display:flex;align-items:center;justify-content:center;padding:0;color:#24353A">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="2" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="2" fill="currentColor"/></svg>
</button>

<!-- gust warning tag (wind coming from the right) -->
<div class="card" style="position:absolute;right:10px;top:300px;height:32px;padding:0 10px;display:flex;align-items:center;color:#24353A;border-radius:10px">
<svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path class="ic" d="M11 2 L5 8 L11 14 M18 2 L12 8 L18 14"/></svg>
</div>

<!-- floating score tag -->
<div class="card" style="position:absolute;left:46px;top:462px;display:flex;flex-direction:column;align-items:center;line-height:1;gap:3px;padding:8px 12px;border-radius:10px;transform:rotate(-6deg)">
<span style="font-size:24px;font-weight:700;color:#BF4630">+2</span>
<span style="font-size:11px;font-weight:600;letter-spacing:.12em">PERFECT</span>
</div>

</div>
</body>
</html>
